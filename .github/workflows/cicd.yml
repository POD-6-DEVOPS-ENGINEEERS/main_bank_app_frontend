
name: Bank Frontend Pipeline

on:
  push:
    branches:
      - main
      - features/mikky
  # pull_request:
  #   branches:
  #     - cicd

jobs:
  Continues-Integration_build_and_push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        repository: POD-6-DEVOPS-ENGINEEERS/main_bank_app_frontend
        ref: main


    - name: Log in to awscli
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-north-1


    - name: Build container image
      run: docker build -t bank-app-frontend:latest .

    - name: Log in to ECR with short-lived credentials
      run: |
        aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin ${{ vars.ECR_REPO }}
  
    - name: Tag Docker image
      run: docker tag bank-app-frontend:latest ${{ vars.ECR_REPO }}/bank-frontend:${{ github.run_number }}
    
    - name: Push image to ECR
      run: docker push ${{ vars.ECR_REPO }}/bank-frontend:${{ github.run_number }}


    - name: Clean up Docker image locally
      run: |
        docker rmi bank-app-frontend:latest
        docker rmi ${{ vars.ECR_REPO }}/bank-frontend:${{ github.run_number }}

    - name: Clean up GitHub repo on runner
      run: rm -rf ./*


  Continues-Update_k8s_manifest:
     runs-on: ubuntu-latest
     needs: Continues-Integration_build_and_push
     permissions:
      contents: write

     steps:
      # Step 1: Securely download the Kubernetes manifest repository
      - name: Checkout Deployment Repo
        uses: actions/checkout@v4
        with:
          repository: 'POD-6-DEVOPS-ENGINEEERS/kubernetes-manifest'
          token: ${{ secrets.PAT_TOKEN }}

      # Step 2: Use native YAML manipulation to update the image tag version
      - name: Update Frontend Image Tag
        uses: mikefarah/yq@master
        with:
          cmd: yq eval '.spec.template.spec.containers[0].image = "${{ vars.ECR_REPO }}/bank-frontend:${{ github.run_number }}"' -i ./bank-project/frontend.yaml

      # Step 3: Debug line to visually confirm the version update in your runner logs
      - name: Verify Updated Manifest
        run: |
          echo "=== UPDATED MANIFEST CONTENT ==="
          cat ./bank-project/frontend.yaml

      # Step 4: Save, commit, and securely push the updated file back to the manifest repo
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update frontend image to version ${{ github.run_number }} [skip ci]"
          branch: main















